<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat P2P - PeerJS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💬 Chat P2P Temps Réel</h1>
            <p class="subtitle">Partagez votre ID avec un ami pour commencer</p>
        </div>

        <!-- Écran de connexion -->
        <div id="connection-screen" class="screen active">
            <div class="card">
                <div class="my-id-section">
                    <label>Votre ID unique :</label>
                    <div class="id-display">
                        <span id="my-peer-id">Génération en cours...</span>
                        <button id="copy-id-btn" class="btn-copy" disabled>
                            📋 Copier
                        </button>
                    </div>
                    <p class="id-status" id="id-status">Connexion au serveur...</p>
                </div>

                <div class="connect-section">
                    <label for="remote-peer-id">ID du destinataire :</label>
                    <div class="input-group">
                        <input 
                            type="text" 
                            id="remote-peer-id" 
                            placeholder="Collez l'ID de votre ami ici..."
                            autocomplete="off"
                        >
                        <button id="connect-btn" class="btn-connect">
                            🔗 Connecter
                        </button>
                    </div>
                    <p class="help-text">
                        Demandez à votre ami de partager son ID et collez-le ci-dessus
                    </p>
                </div>
            </div>
        </div>

        <!-- Écran de chat -->
        <div id="chat-screen" class="screen">
            <div class="chat-header">
                <div class="chat-header-info">
                    <span class="connection-indicator" id="connection-indicator"></span>
                    <span>Connecté avec : <strong id="connected-peer-id"></strong></span>
                </div>
                <button id="disconnect-btn" class="btn-disconnect">
                    ❌ Déconnecter
                </button>
            </div>

            <div class="messages-container" id="messages-container">
                <div class="messages-list" id="messages-list">
                    <!-- Les messages apparaîtront ici -->
                </div>
            </div>

            <div class="message-input-container">
                <input 
                    type="text" 
                    id="message-input" 
                    placeholder="Écrivez votre message..."
                    autocomplete="off"
                >
                <button id="send-btn" class="btn-send">
                    Envoyer ✉️
                </button>
            </div>
        </div>
    </div>

    <!-- Bibliothèque PeerJS -->
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
